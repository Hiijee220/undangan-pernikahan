<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Undangan</title><link rel="stylesheet" href="style.css?v=3"></head><body class="admin-shell"><header class="admin-head"><div><h1>Admin Undangan</h1><small id="user">Silakan masuk</small></div><a href="index.html">Lihat website</a></header><main class="admin-wrap"><section id="login" class="admin-card login-card"><h2>Login Admin</h2><p>Masuk menggunakan akun Google admin.</p><button id="loginBtn" class="admin-button">Masuk dengan Google</button></section><div id="editor" hidden><section class="admin-card"><h2>Nama Tamu Undangan</h2><p>Tulis nama tamu, kemudian salin tautan khusus.</p><div class="guest-link-row"><input id="guestName" placeholder="Contoh: Keluarga Bapak Silo"><button id="copyBtn" class="admin-button">Salin Link Tamu</button></div></section><form id="form"><section class="admin-card"><h2>Isi Undangan</h2><div class="form-grid" id="fields"></div></section><section class="admin-card"><h2>Foto Undangan</h2><label>Foto sampul utama<input id="heroUpload" type="file" accept="image/*"></label><label>Foto pasangan<input id="coupleUpload" type="file" accept="image/*"></label><label>Tambah foto galeri<input id="galleryUpload" type="file" accept="image/*" multiple></label><div id="thumbs" class="thumbs"></div></section><button class="admin-button" type="submit">Simpan Semua Perubahan</button><button id="logoutBtn" class="admin-button secondary" type="button">Keluar</button><span id="status"></span></form></div></main><script type="module" src="admin.js?v=3"></script></body></html>
